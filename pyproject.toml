[project]
name = "seldon"
version = "0.1.0"
description = "Prediction and knowledge graph backend for The Seldon Project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "httpx>=0.27.0",
    "networkx>=3.2.1",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seldon"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0",
]
