[project]
name = "seldon"
version = "0.1.0"
description = "Prediction and knowledge graph backend for The Seldon Project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "beautifulsoup4>=4.12",
    "ddgs>=9.0",
    "fastapi>=0.136.1",
    "httpx>=0.27.0",
    "networkx>=3.2.1",
    "pydantic>=2.6.0",
    "psycopg[binary]>=3.2",
    "rich>=13.7.0",
    "sqlalchemy>=2.0",
    "trafilatura>=1.12",
    "uvicorn[standard]>=0.30",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
seldon = "seldon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/seldon"]

[tool.pytest.ini_options]
markers = [
    "live_openrouter: tests that call the real OpenRouter API and require OPENROUTER_API_KEY",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0",
    "ruff>=0.15.12",
]
