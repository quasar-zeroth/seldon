services:
  api:
    build: .
    command: sh -c "seldon migrate && uvicorn seldon.api.app:app --host 0.0.0.0 --port 8000"
    environment:
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SELDON_LLM_PROVIDER: ${SELDON_LLM_PROVIDER:-}
      SELDON_API_KEY: ${SELDON_API_KEY:-}
      SELDON_REQUIRE_API_KEY: ${SELDON_REQUIRE_API_KEY:-true}
      SELDON_ALLOW_LOCALHOST_WITHOUT_API_KEY: ${SELDON_ALLOW_LOCALHOST_WITHOUT_API_KEY:-false}
      SELDON_DATABASE_URL: postgresql+psycopg://seldon:seldon_dev_password@postgres:5432/seldon
      SELDON_DATA_DIR: /app/data
    volumes:
      - seldon-data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "seldon.cli", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm ci && npm run build && npm run dev -- --hostname 0.0.0.0"
    environment:
      SELDON_API_URL: http://api:8000
      NEXT_PUBLIC_SELDON_API_URL: http://localhost:8000
      NEXT_PUBLIC_SELDON_BROWSER_API_URL: http://localhost:8000
      NEXT_PUBLIC_SELDON_API_KEY: ${SELDON_API_KEY:-}
    volumes:
      - ./apps/web:/app
    ports:
      - "3000:3000"
    depends_on:
      - api

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: seldon
      POSTGRES_USER: seldon
      POSTGRES_PASSWORD: seldon_dev_password
    volumes:
      - seldon-postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seldon -d seldon"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  seldon-data:
  seldon-postgres:
